# Link Ride remote-testing deployment profile.
# This file contains no credentials. Enable only with SPRING_PROFILES_ACTIVE=prod.
# Local development continues using application.properties unchanged.

# Hosted database connection: all values required in production.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Verify the existing schema rather than automatically changing it.
# The remote PostgreSQL schema must be provisioned before enabling this profile.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Hosted RabbitMQ: do not fall back to local guest credentials.
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Turn off verbose SQL-related logging in the hosted service.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
