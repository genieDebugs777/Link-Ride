# Link Ride remote-testing deployment profile.
# This file contains no credentials. Enable only with SPRING_PROFILES_ACTIVE=prod.
# Local development continues using application.properties unchanged.

# Hosted database connection: all values required in production.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Verify the existing schema rather than automatically changing it.
# The remote PostgreSQL schema must be provisioned before enabling this profile.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# CloudAMQP production connection.
# The environment variable contains the complete amqps:// URL.
spring.rabbitmq.addresses=${RABBITMQ_URL}
spring.rabbitmq.ssl.enabled=true
spring.rabbitmq.ssl.validate-server-certificate=true
spring.rabbitmq.ssl.verify-hostname=true

# Turn off verbose SQL-related logging in the hosted service.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Production transactional email through Brevo HTTPS API.
linkride.mail.from=${MAIL_FROM}
linkride.mail.from-name=${MAIL_FROM_NAME:Link Ride}

# Production uses Brevo HTTPS, not JavaMailSender SMTP.
spring.autoconfigure.exclude=org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration