# Link Ride isolated testing profile

# In-memory database
spring.datasource.url=jdbc:h2:mem:linkride_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate test schema
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT - test-only signing key, not a production credential
jwt.secret=link-ride-test-only-secret-key-32-characters-long
jwt.expiration=3600000

# No RabbitMQ consumers or queue declarations during testing
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
spring.rabbitmq.dynamic=false

# Do not initialize SMTP or the default Spring Security user
spring.autoconfigure.exclude=org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Harmless mail sender metadata for tests
linkride.mail.from=linkride-test@example.invalid
linkride.mail.from-name=Link Ride Test