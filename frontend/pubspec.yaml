name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  http: ^1.5.0
  cupertino_icons: ^1.0.8
  flutter_secure_storage: 9.2.4
  path_provider_foundation: 2.5.1
  shared_preferences: ^2.5.5
  geolocator: ^14.0.2
  url_launcher: ^6.3.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/link_ride_logo.png
    - assets/link_ride_header_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/link_ride_app_icon.png"
  min_sdk_android: 21
